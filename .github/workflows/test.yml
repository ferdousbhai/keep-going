name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # The build writes both bundles, hook files and the stamped versions,
      # and all of them ship from the tree. A skipped build has to fail here
      # rather than release stale files.
      - name: Verify committed build output
        run: git diff --exit-code -- extensions plugins/keep-going .claude-plugin/marketplace.json
