name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # The build writes both bundles, hook files and the stamped versions,
      # and all of them ship from the tree. A skipped build has to fail here
      # rather than release stale files.
      - name: Verify committed build output
        run: git diff --exit-code -- extensions plugins/keep-going .claude-plugin/marketplace.json packaging/aur/keep-going/PKGBUILD
      - name: Installer and release script checks
        run: |
          bash packaging/repo/test.sh
          python3 packaging/repo/test_arch.py
          bash -n bin/build-package bin/arch-run bin/release bin/verify-release packaging/aur/keep-going/PKGBUILD
