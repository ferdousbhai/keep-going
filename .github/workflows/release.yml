name: release

# Pushing the tag is what creates the release. v0.13.1 was tagged and pushed
# without a release ever being created, and nothing noticed until the next one
# shipped, so the step does not belong to whoever remembers it.
#
# Notes come from the tag itself, which means an annotated one:
#
#   git tag -a --cleanup=verbatim v0.15.0 -F notes.md
#   git push origin v0.15.0
#
# --cleanup=verbatim is not optional. Git strips every line beginning with #
# from a tag message by default, which silently deletes each "## Changed" and
# "## Fixed" heading and leaves the bullets running together.
#
# The release is created as a draft, beside the native package this run
# builds: the pacman repository's Server is releases/latest/download, so a
# published release without the signed database would break every user's
# `pacman -Sy`. bin/release signs the package locally, uploads the repository
# and install.sh, and publishes; verify-release.yml then installs it.
#
# A lightweight tag resolves to its commit, so %(contents) would hand back the
# release commit's message and trailer rather than notes. The object type is
# the only honest test of whether anything was written, and a tag with nothing
# to say falls back to notes generated from the commits since the last one.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml
  package:
    needs: test
    # arch=any: one native build serves x86_64 and aarch64. verify-release.yml
    # installs the published package on both.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install Arch chroot tools
        run: |
          sudo apt-get update
          sudo apt-get install -y arch-install-scripts zstd
      - name: Build the package in a disposable Arch root
        run: sudo bin/arch-run bin/build-package /output
      - uses: actions/upload-artifact@v4
        with:
          name: keep-going-package
          path: |
            target/packages/*.pkg.tar.zst
            target/packages/source-commit.txt
          if-no-files-found: error
  release:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The tag object and its message, and the history --generate-notes
          # walks when the tag carries none.
          fetch-depth: 0
          fetch-tags: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already has a release; nothing to do."
            exit 0
          fi
          notes=""
          if [ "$(git cat-file -t "$TAG")" = "tag" ]; then
            notes=$(git tag -l --format='%(contents)' "$TAG")
          fi
          if [ -n "${notes//[[:space:]]/}" ]; then
            gh release create "$TAG" --draft --verify-tag --title "keep going $TAG" --notes "$notes"
          else
            echo "::warning::$TAG is not an annotated tag; releasing with generated notes."
            gh release create "$TAG" --draft --verify-tag --title "keep going $TAG" --generate-notes
          fi
